<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Details </title>
    <img src="./images/images3.jpg" width="2000px" height="200px" />
    <H1>PATIENT DETAILS MANAGEMENT FORM</H1>
    <hr length =2500px />
</head>
<body>
    <h3> Submit the Form</h3>
    <table>
        <Form method="GET">
            <tr>
            <td> Patient name</td>
            <td> <input name="patient name" placeholder="Enter patient name..." maxlength="15"/></td>
            </tr>
            <tr>
            <td> Blood Group</td>
            <td> <input name="Blood Group" placeholder="A+ /B+...." maxlength="10"/></td>
            </tr>
             <tr>
            <td> Date of Birth</td>
            <td> <input name="dob" placeholder="DD-MM-YYYY"/></td>
            </tr>
             <tr>
            <td> Date of appointemnt</td>
            <td> <input name="doa" type="date" placeholder=""/></td>
            </tr>
            <tr>
            <td> Total Bill</td>
            <td> <input name="bill" placeholder="In RS / -"/></td>
            </tr>
            <tr>
            <td> Contact Number </td>
            <td> <input name="num"   type="tel"  placeholder="97*******" maxlength="10"/></td>
            </tr>
            <tr>
            <td> Submit </td>
            <td> <button name='submit' style="background-color: blue; color: white;" > Submit</button>
            </td>
            </tr>
        </Form>
       
    </table>
    
</body>
</html>
